<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>계정정보 화면 시안</title>
  <style>
    :root {
      --bg-top: oklch(95% 0.03 195);
      --bg-bottom: oklch(92% 0.03 210);
      --shell: oklch(99% 0.004 95);
      --surface: oklch(100% 0.002 95 / 0.82);
      --surface-strong: oklch(99% 0.01 190 / 0.92);
      --surface-soft: oklch(97% 0.02 100 / 0.8);
      --line: oklch(90% 0.02 190);
      --line-strong: oklch(84% 0.03 195);
      --fg: oklch(32% 0.05 208);
      --muted: oklch(54% 0.03 205);
      --teal: oklch(72% 0.12 191);
      --teal-strong: oklch(54% 0.1 207);
      --sky: oklch(82% 0.08 235);
      --sand: oklch(95% 0.05 101);
      --danger: oklch(63% 0.16 22);
      --danger-soft: oklch(97% 0.02 20);
      --shadow: 0 24px 60px rgba(32, 111, 126, 0.14);
      --shadow-soft: 0 16px 32px rgba(71, 159, 178, 0.12);
      --font-body: "Pretendard Variable", "SUIT Variable", "Apple SD Gothic Neo",
        "Noto Sans KR", system-ui, sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      font-family: var(--font-body);
      color: var(--fg);
      background:
        radial-gradient(circle at 18% 18%, rgba(145, 232, 226, 0.92), transparent 28%),
        radial-gradient(circle at 82% 14%, rgba(183, 214, 255, 0.8), transparent 22%),
        linear-gradient(180deg, #f0fffd 0%, #effaf8 48%, #fffdf5 100%);
    }

    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 28px 16px;
      overflow: hidden;
    }

    body::before,
    body::after {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
    }

    body::before {
      background:
        radial-gradient(circle at 50% 100%, rgba(255, 255, 255, 0.65), transparent 34%),
        linear-gradient(180deg, rgba(255, 255, 255, 0.45), transparent 36%);
    }

    body::after {
      background:
        repeating-linear-gradient(
          120deg,
          rgba(255, 255, 255, 0.14) 0,
          rgba(255, 255, 255, 0.14) 1px,
          transparent 1px,
          transparent 28px
        );
      opacity: 0.45;
    }

    .phone {
      width: min(100%, 390px);
      height: min(844px, calc(100vh - 32px));
      padding: 12px;
      border-radius: 42px;
      background:
        linear-gradient(180deg, rgba(255, 255, 255, 0.65), rgba(255, 255, 255, 0.18)),
        rgba(12, 37, 49, 0.08);
      box-shadow:
        0 40px 100px rgba(28, 72, 82, 0.24),
        inset 0 0 0 1px rgba(255, 255, 255, 0.6);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      position: relative;
    }

    .phone::before {
      content: "";
      position: absolute;
      top: 14px;
      left: 50%;
      width: 112px;
      height: 30px;
      transform: translateX(-50%);
      border-radius: 999px;
      background: rgba(20, 34, 40, 0.85);
      z-index: 3;
    }

    .screen {
      height: 100%;
      border-radius: 32px;
      overflow: hidden;
      background:
        radial-gradient(circle at 12% 8%, rgba(144, 230, 221, 0.46), transparent 24%),
        radial-gradient(circle at 88% 12%, rgba(183, 211, 255, 0.44), transparent 24%),
        linear-gradient(180deg, rgba(255, 255, 255, 0.72), rgba(255, 255, 255, 0.92)),
        linear-gradient(180deg, #effbf9 0%, #f8fffd 58%, #fffdf7 100%);
      border: 1px solid rgba(255, 255, 255, 0.8);
      position: relative;
      padding: 56px 18px 18px;
      display: grid;
      grid-template-rows: auto auto auto 1fr auto;
      gap: 12px;
    }

    .screen::before {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background:
        linear-gradient(180deg, rgba(255, 255, 255, 0.32), transparent 24%),
        radial-gradient(circle at 50% 100%, rgba(255, 236, 171, 0.25), transparent 26%);
    }

    .topbar,
    .hero,
    .panel,
    .logout {
      position: relative;
      z-index: 1;
    }

    .topbar {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .icon-button {
      width: 42px;
      height: 42px;
      border-radius: 16px;
      border: 1px solid rgba(255, 255, 255, 0.82);
      background: rgba(255, 255, 255, 0.62);
      display: grid;
      place-items: center;
      box-shadow: var(--shadow-soft);
      color: var(--fg);
      font-size: 20px;
      font-weight: 700;
    }

    .topbar-copy {
      flex: 1;
      min-width: 0;
    }

    .topbar-copy strong {
      display: block;
      font-size: 1.62rem;
      line-height: 1.05;
      letter-spacing: -0.04em;
    }

    .topbar-copy span {
      display: block;
      margin-top: 4px;
      color: var(--muted);
      font-size: 0.85rem;
      font-weight: 700;
    }

    .provider {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 66px;
      height: 38px;
      padding: 0 12px;
      border-radius: 14px;
      background:
        linear-gradient(135deg, rgba(255, 246, 200, 0.94), rgba(212, 247, 241, 0.96));
      border: 1px solid rgba(255, 255, 255, 0.88);
      box-shadow: 0 10px 22px rgba(84, 173, 186, 0.18);
      color: var(--teal-strong);
      font-size: 0.74rem;
      font-weight: 900;
      letter-spacing: 0.08em;
    }

    .hero {
      padding: 18px;
      border-radius: 28px;
      background:
        linear-gradient(180deg, rgba(255, 255, 255, 0.78), rgba(255, 255, 255, 0.64)),
        linear-gradient(135deg, rgba(255, 254, 245, 0.9), rgba(240, 252, 249, 0.9));
      border: 1px solid rgba(255, 255, 255, 0.92);
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .hero::before {
      content: "";
      position: absolute;
      top: -22px;
      right: -18px;
      width: 120px;
      height: 120px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(157, 217, 255, 0.72), rgba(157, 217, 255, 0));
      opacity: 0.8;
    }

    .hero-main {
      display: flex;
      align-items: flex-start;
      gap: 14px;
    }

    .avatar {
      width: 84px;
      height: 84px;
      border-radius: 24px;
      background:
        linear-gradient(180deg, rgba(255, 255, 255, 0.88), rgba(240, 251, 246, 0.92));
      border: 1px solid var(--line);
      box-shadow: 0 14px 28px rgba(105, 182, 197, 0.18);
      display: grid;
      place-items: center;
      position: relative;
      flex: 0 0 auto;
    }

    .avatar img {
      width: 66px;
      height: 66px;
      object-fit: contain;
      filter: drop-shadow(0 10px 22px rgba(109, 190, 205, 0.24));
    }

    .avatar-badge {
      position: absolute;
      right: -4px;
      bottom: -6px;
      height: 26px;
      padding: 0 10px;
      border-radius: 10px;
      background: var(--sand);
      border: 2px solid rgba(255, 255, 255, 0.95);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: var(--teal-strong);
      font-size: 0.66rem;
      font-weight: 900;
    }

    .hero-copy {
      min-width: 0;
      flex: 1;
      padding-top: 2px;
    }

    .hero-copy strong {
      display: block;
      font-size: 1.9rem;
      line-height: 1;
      letter-spacing: -0.05em;
    }

    .hero-copy p {
      margin: 8px 0 0;
      color: var(--muted);
      font-size: 0.92rem;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .session {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 16px;
      padding: 12px 14px;
      border-radius: 18px;
      background: rgba(237, 251, 249, 0.86);
      border: 1px solid rgba(193, 231, 229, 0.9);
    }

    .session-mark {
      width: 36px;
      height: 36px;
      border-radius: 14px;
      background: rgba(34, 184, 183, 0.12);
      display: grid;
      place-items: center;
      color: var(--teal-strong);
      font-size: 0.95rem;
      font-weight: 900;
    }

    .session-copy strong {
      display: block;
      font-size: 0.95rem;
      line-height: 1.1;
    }

    .session-copy span {
      display: block;
      margin-top: 4px;
      color: var(--muted);
      font-size: 0.8rem;
      font-weight: 700;
    }

    .panel {
      padding: 16px;
      border-radius: 24px;
      background: rgba(255, 255, 255, 0.78);
      border: 1px solid rgba(255, 255, 255, 0.9);
      box-shadow: var(--shadow-soft);
    }

    .panel-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 10px;
    }

    .panel-header strong {
      font-size: 1rem;
      letter-spacing: -0.02em;
    }

    .panel-header span {
      color: var(--teal-strong);
      font-size: 0.72rem;
      font-weight: 900;
      letter-spacing: 0.08em;
    }

    .detail-list,
    .menu-list {
      display: grid;
      gap: 0;
    }

    .detail-row,
    .menu-row {
      display: flex;
      align-items: center;
      gap: 12px;
      min-height: 54px;
      padding: 9px 0;
    }

    .detail-row + .detail-row,
    .menu-row + .menu-row {
      border-top: 1px solid rgba(188, 226, 219, 0.8);
    }

    .detail-icon,
    .menu-icon {
      width: 40px;
      height: 40px;
      border-radius: 15px;
      display: grid;
      place-items: center;
      flex: 0 0 auto;
      background: linear-gradient(180deg, rgba(236, 250, 248, 0.9), rgba(255, 249, 229, 0.88));
      border: 1px solid rgba(192, 230, 223, 0.94);
      color: var(--teal-strong);
      font-size: 0.98rem;
      font-weight: 900;
    }

    .detail-copy,
    .menu-copy {
      min-width: 0;
      flex: 1;
    }

    .detail-copy label,
    .menu-copy strong {
      display: block;
      font-size: 0.92rem;
      font-weight: 900;
      letter-spacing: -0.02em;
    }

    .detail-copy span,
    .menu-copy span {
      display: block;
      margin-top: 4px;
      color: var(--muted);
      font-size: 0.79rem;
      line-height: 1.35;
    }

    .detail-value {
      max-width: 132px;
      text-align: right;
      color: var(--fg);
      font-size: 0.88rem;
      font-weight: 900;
      line-height: 1.3;
    }

    .menu-chevron {
      color: var(--muted);
      font-size: 1.2rem;
      font-weight: 700;
    }

    .logout {
      height: 50px;
      border-radius: 18px;
      border: 1px solid rgba(213, 120, 106, 0.22);
      background: rgba(255, 255, 255, 0.72);
      color: var(--danger);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-size: 0.95rem;
      font-weight: 900;
      box-shadow: 0 10px 24px rgba(211, 136, 121, 0.08);
    }

    @media (max-height: 860px) {
      body {
        overflow: auto;
      }

      .phone {
        height: 844px;
      }
    }
  </style>
</head>
<body>
  <main class="phone" aria-label="계정정보 화면 시안">
    <section class="screen">
      <header class="topbar">
        <div class="icon-button" aria-hidden="true">‹</div>
        <div class="topbar-copy">
          <strong>계정정보</strong>
          <span>카카오 계정 연결됨</span>
        </div>
        <div class="provider">KAKAO</div>
      </header>

      <section class="hero" aria-label="프로필 요약">
        <div class="hero-main">
          <div class="avatar">
            <img src="assets/images/brand/magic_conch.png" alt="매직소라 조개 심볼" />
            <div class="avatar-badge">카카오</div>
          </div>
          <div class="hero-copy">
            <strong>매직소라</strong>
            <p>대화 기록과 계정 설정을 이 화면에서 정리합니다.</p>
          </div>
        </div>
        <div class="session">
          <div class="session-mark">✓</div>
          <div class="session-copy">
            <strong>로그인 유지 중</strong>
            <span>계정 연결 상태가 정상입니다.</span>
          </div>
        </div>
      </section>

      <section class="panel" aria-label="계정 상세">
        <div class="panel-header">
          <strong>계정 상세</strong>
          <span>연결됨</span>
        </div>
        <div class="detail-list">
          <div class="detail-row">
            <div class="detail-icon">◎</div>
            <div class="detail-copy">
              <label>로그인 방식</label>
            </div>
            <div class="detail-value">카카오</div>
          </div>
          <div class="detail-row">
            <div class="detail-icon">@</div>
            <div class="detail-copy">
              <label>이메일</label>
            </div>
            <div class="detail-value">연결된 카카오 이메일</div>
          </div>
          <div class="detail-row">
            <div class="detail-icon">◌</div>
            <div class="detail-copy">
              <label>기록 상태</label>
            </div>
            <div class="detail-value">계정 기록 연결</div>
          </div>
          <div class="detail-row">
            <div class="detail-icon">1.0</div>
            <div class="detail-copy">
              <label>앱 버전</label>
            </div>
            <div class="detail-value">1.0</div>
          </div>
        </div>
      </section>

      <section class="panel" aria-label="설정과 기록">
        <div class="panel-header">
          <strong>설정과 기록</strong>
          <span>곧 제공</span>
        </div>
        <div class="menu-list">
          <div class="menu-row">
            <div class="menu-icon">⟳</div>
            <div class="menu-copy">
              <strong>내 토론 기록</strong>
              <span>저장된 토론과 이전 결론을 확인합니다.</span>
            </div>
            <div class="menu-chevron">›</div>
          </div>
          <div class="menu-row">
            <div class="menu-icon">≋</div>
            <div class="menu-copy">
              <strong>평가 기준 설정</strong>
              <span>논리성, 근거, 현실성 가중치를 조정합니다.</span>
            </div>
            <div class="menu-chevron">›</div>
          </div>
          <div class="menu-row">
            <div class="menu-icon">◔</div>
            <div class="menu-copy">
              <strong>알림 설정</strong>
              <span>토론 완료와 세션 업데이트 알림을 관리합니다.</span>
            </div>
            <div class="menu-chevron">›</div>
          </div>
          <div class="menu-row">
            <div class="menu-icon">?</div>
            <div class="menu-copy">
              <strong>도움말</strong>
              <span>토론 방식과 점수 계산 기준을 확인합니다.</span>
            </div>
            <div class="menu-chevron">›</div>
          </div>
        </div>
      </section>

      <div class="logout">↗ 로그아웃</div>
    </section>
  </main>
</body>
</html>
