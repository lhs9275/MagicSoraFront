<!doctype html>
<html lang="ko"><head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>계정정보 화면 시안 2</title>
  <style>
    :root {
      --bg-top: oklch(97% 0.022 208);
      --bg-bottom: oklch(91% 0.058 238);
      --surface: oklch(100% 0.003 250 / 0.82);
      --surface-strong: oklch(99% 0.015 235 / 0.94);
      --surface-soft: oklch(98% 0.016 280 / 0.9);
      --line: oklch(90% 0.016 228);
      --line-strong: oklch(81% 0.042 231);
      --fg: oklch(31% 0.044 228);
      --muted: oklch(55% 0.026 226);
      --teal: oklch(73% 0.122 211);
      --teal-strong: oklch(49% 0.104 233);
      --shell-blue: oklch(86% 0.052 264);
      --gold: oklch(88% 0.12 92);
      --sand: oklch(97% 0.028 104);
      --foam: oklch(99% 0.01 95);
      --icon-ink: oklch(41% 0.05 246);
      --icon-ink-soft: oklch(54% 0.04 244);
      --icon-bg-top: rgba(249, 251, 255, 0.98);
      --icon-bg-bottom: rgba(235, 241, 255, 0.94);
      --icon-border: rgba(191, 208, 236, 0.96);
      --icon-shadow: 0 10px 22px rgba(93, 121, 182, 0.12);
      --danger: oklch(63% 0.16 22);
      --shadow: 0 24px 60px rgba(44, 96, 154, 0.16);
      --shadow-soft: 0 16px 32px rgba(76, 138, 210, 0.12);
      --font-body: "Pretendard Variable", "SUIT Variable", "Apple SD Gothic Neo",
        "Noto Sans KR", system-ui, sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      font-family: var(--font-body);
      color: var(--fg);
      background:
        radial-gradient(circle at 18% 18%, rgba(145, 232, 226, 0.72), transparent 28%),
        radial-gradient(circle at 82% 14%, rgba(199, 205, 255, 0.62), transparent 22%),
        linear-gradient(180deg, #f7fffe 0%, #edf8ff 52%, #e7f2ff 100%);
    }

    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 28px 16px;
      overflow: hidden;
    }

    body::before,
    body::after {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
    }

    body::before {
      background:
        radial-gradient(circle at 50% 100%, rgba(229, 239, 255, 0.72), transparent 34%),
        linear-gradient(180deg, rgba(255, 255, 255, 0.42), transparent 36%);
    }

    body::after {
      background:
        repeating-linear-gradient(
          120deg,
          rgba(255, 255, 255, 0.14) 0,
          rgba(255, 255, 255, 0.14) 1px,
          transparent 1px,
          transparent 28px
        );
      opacity: 0.45;
    }

    button {
      font: inherit;
    }

    .phone {
      width: min(100%, 390px);
      height: min(844px, calc(100vh - 32px));
      padding: 12px;
      border-radius: 42px;
      background:
        linear-gradient(180deg, rgba(255, 255, 255, 0.65), rgba(255, 255, 255, 0.18)),
        rgba(12, 37, 49, 0.08);
      box-shadow:
        0 40px 100px rgba(28, 72, 82, 0.24),
        inset 0 0 0 1px rgba(255, 255, 255, 0.6);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      position: relative;
    }

    .phone::before {
      content: "";
      position: absolute;
      top: 14px;
      left: 50%;
      width: 112px;
      height: 30px;
      transform: translateX(-50%);
      border-radius: 999px;
      background: rgba(20, 34, 40, 0.85);
      z-index: 4;
    }

    .screen {
      height: 100%;
      border-radius: 32px;
      overflow: hidden;
      background:
        radial-gradient(circle at 12% 8%, rgba(144, 230, 221, 0.36), transparent 24%),
        radial-gradient(circle at 88% 12%, rgba(196, 205, 255, 0.4), transparent 24%),
        linear-gradient(180deg, rgba(255, 255, 255, 0.72), rgba(255, 255, 255, 0.92)),
        linear-gradient(180deg, #f4fdff 0%, #f7fbff 58%, #f2f6ff 100%);
      border: 1px solid rgba(255, 255, 255, 0.8);
      position: relative;
      isolation: isolate;
      padding: 56px 18px 18px;
      display: grid;
      grid-template-rows: auto auto 1fr auto;
      gap: 14px;
    }

    .screen::before {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background:
        linear-gradient(180deg, rgba(255, 255, 255, 0.34), transparent 24%),
        radial-gradient(circle at 50% 100%, rgba(207, 220, 255, 0.22), transparent 28%);
      z-index: 0;
    }

    .screen::after {
      content: "";
      position: absolute;
      left: -8%;
      right: -8%;
      bottom: -8%;
      height: 180px;
      border-radius: 50%;
      background:
        radial-gradient(circle at 50% 0%, rgba(255, 255, 255, 0.45), transparent 52%),
        linear-gradient(180deg, rgba(202, 241, 242, 0.12), rgba(208, 216, 255, 0.28));
      pointer-events: none;
      z-index: 0;
    }

    .topbar,
    .hero-button,
    .panel,
    .logout {
      position: relative;
      z-index: 1;
    }

    .topbar {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .icon-button {
      width: 42px;
      height: 42px;
      border-radius: 16px;
      border: 1px solid var(--icon-border);
      background:
        linear-gradient(180deg, var(--icon-bg-top), var(--icon-bg-bottom));
      display: grid;
      place-items: center;
      box-shadow: var(--icon-shadow);
      color: var(--icon-ink);
      font-size: 20px;
      font-weight: 700;
    }

    .topbar-copy {
      flex: 1;
      min-width: 0;
    }

    .topbar-copy strong {
      display: block;
      font-size: 1.58rem;
      line-height: 1.03;
      letter-spacing: -0.04em;
    }

    .topbar-copy span {
      display: block;
      margin-top: 4px;
      color: var(--muted);
      font-size: 0.82rem;
      font-weight: 700;
    }

    .provider {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 68px;
      height: 38px;
      padding: 0 12px;
      border-radius: 14px;
      background:
        linear-gradient(135deg, rgba(255, 247, 208, 0.96), rgba(241, 244, 255, 0.98));
      border: 1px solid rgba(255, 255, 255, 0.88);
      box-shadow: 0 10px 22px rgba(107, 145, 214, 0.16);
      color: var(--teal-strong);
      font-size: 0.72rem;
      font-weight: 900;
      letter-spacing: 0.08em;
    }

    .hero-button {
      width: 100%;
      padding: 0;
      border: 0;
      background: none;
      text-align: left;
      cursor: pointer;
    }

    .hero-button:focus-visible {
      outline: none;
    }

    .hero {
      padding: 18px;
      border-radius: 28px;
      background:
        radial-gradient(circle at 88% 18%, rgba(210, 205, 255, 0.52), transparent 24%),
        radial-gradient(circle at 8% 100%, rgba(170, 241, 239, 0.42), transparent 28%),
        linear-gradient(180deg, rgba(255, 255, 255, 0.84), rgba(255, 255, 255, 0.68)),
        linear-gradient(135deg, rgba(252, 254, 255, 0.96), rgba(240, 248, 255, 0.96));
      border: 1px solid rgba(255, 255, 255, 0.92);
      box-shadow: var(--shadow);
      overflow: hidden;
      transition: transform 220ms ease, box-shadow 220ms ease;
      position: relative;
    }

    .hero::before {
      content: "";
      position: absolute;
      top: -22px;
      right: -18px;
      width: 130px;
      height: 130px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(182, 200, 255, 0.68), rgba(182, 200, 255, 0));
      opacity: 0.8;
    }

    .hero::after {
      content: "";
      position: absolute;
      left: -8%;
      right: -8%;
      bottom: -52px;
      height: 110px;
      border-radius: 50%;
      background:
        radial-gradient(circle at 50% 0%, rgba(255, 255, 255, 0.62), transparent 50%),
        linear-gradient(180deg, rgba(190, 240, 242, 0.16), rgba(215, 220, 255, 0.34));
      opacity: 0.95;
    }

    .hero-button:hover .hero,
    .hero-button:focus-visible .hero {
      transform: translateY(-2px);
      box-shadow: 0 26px 64px rgba(58, 112, 177, 0.2);
    }

    .hero-brand {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      position: relative;
      z-index: 1;
      margin-bottom: 14px;
    }

    .brand-wordmark {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: #fffefb;
      font-size: 1.08rem;
      font-weight: 900;
      letter-spacing: -0.04em;
      text-shadow:
        0 0 0 #efac32,
        1px 0 0 #efac32,
        -1px 0 0 #efac32,
        0 1px 0 #efac32,
        0 -1px 0 #efac32,
        0 8px 18px rgba(239, 172, 50, 0.18);
    }

    .brand-wordmark::before {
      content: "✦";
      color: rgba(255, 211, 104, 0.98);
      font-size: 0.88rem;
      text-shadow: none;
    }

    .hero-action {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      border-radius: 999px;
      background: rgba(245, 248, 255, 0.78);
      border: 1px solid rgba(255, 255, 255, 0.9);
      color: var(--teal-strong);
      font-size: 0.76rem;
      font-weight: 900;
      letter-spacing: 0.04em;
      box-shadow: 0 10px 20px rgba(108, 146, 214, 0.1);
    }

    .hero-main {
      display: flex;
      align-items: flex-start;
      gap: 14px;
      position: relative;
      z-index: 1;
    }

    .avatar {
      width: 88px;
      height: 88px;
      border-radius: 26px;
      background:
        linear-gradient(180deg, rgba(255, 255, 255, 0.96), rgba(241, 246, 255, 0.98));
      border: 1px solid rgba(255, 255, 255, 0.96);
      box-shadow: 0 14px 28px rgba(105, 182, 197, 0.18);
      display: grid;
      place-items: center;
      position: relative;
      flex: 0 0 auto;
    }

    .avatar::before {
      content: "";
      position: absolute;
      inset: 8px;
      border-radius: 20px;
      background:
        linear-gradient(180deg, rgba(232, 248, 249, 0.94), rgba(238, 237, 255, 0.9));
      z-index: 0;
    }

    .avatar img {
      width: 68px;
      height: 68px;
      object-fit: contain;
      position: relative;
      z-index: 1;
      filter: drop-shadow(0 10px 22px rgba(109, 190, 205, 0.24));
    }

    .avatar-badge {
      position: absolute;
      right: -4px;
      bottom: -6px;
      height: 26px;
      padding: 0 10px;
      border-radius: 10px;
      background: linear-gradient(135deg, rgba(255, 247, 214, 0.98), rgba(243, 245, 255, 0.96));
      border: 2px solid rgba(255, 255, 255, 0.95);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: var(--teal-strong);
      font-size: 0.66rem;
      font-weight: 900;
      z-index: 2;
    }

    .hero-copy {
      min-width: 0;
      flex: 1;
      padding-top: 2px;
    }

    .hero-copy strong {
      display: block;
      font-size: 1.84rem;
      line-height: 1;
      letter-spacing: -0.05em;
    }

    .hero-copy p {
      margin: 8px 0 0;
      color: var(--muted);
      font-size: 0.84rem;
      font-weight: 700;
      line-height: 1.45;
      max-width: 20ch;
    }

    .hero-account {
      display: grid;
      gap: 6px;
      margin-top: 12px;
      max-width: 22ch;
    }

    .hero-login-state {
      display: inline-flex;
      width: fit-content;
      align-items: center;
      min-height: 26px;
      padding: 0 10px;
      border-radius: 999px;
      background: linear-gradient(135deg, rgba(235, 244, 255, 0.98), rgba(243, 240, 255, 0.96));
      border: 1px solid rgba(198, 211, 241, 0.9);
      color: var(--icon-ink);
      font-size: 0.72rem;
      font-weight: 900;
      letter-spacing: 0.01em;
    }

    .hero-email {
      color: var(--fg);
      font-size: 0.84rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .session {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-top: 16px;
      padding: 12px 14px;
      border-radius: 18px;
      background: rgba(244, 249, 255, 0.9);
      border: 1px solid rgba(201, 221, 247, 0.94);
      position: relative;
      z-index: 1;
    }

    .session-left {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }

    .session-mark {
      width: 36px;
      height: 36px;
      border-radius: 14px;
      background:
        linear-gradient(180deg, rgba(229, 242, 255, 0.98), rgba(236, 239, 255, 0.95));
      border: 1px solid var(--icon-border);
      box-shadow: var(--icon-shadow);
      display: grid;
      place-items: center;
      color: var(--icon-ink);
      font-size: 0.95rem;
      font-weight: 900;
      flex: 0 0 auto;
    }

    .session-copy strong {
      display: block;
      font-size: 0.95rem;
      line-height: 1.1;
    }

    .session-copy span {
      display: block;
      margin-top: 4px;
      color: var(--muted);
      font-size: 0.78rem;
      font-weight: 700;
    }

    .session-chevron {
      color: var(--icon-ink-soft);
      font-size: 1.2rem;
      font-weight: 800;
      line-height: 1;
      flex: 0 0 auto;
    }

    .panel {
      padding: 16px;
      border-radius: 24px;
      background: rgba(255, 255, 255, 0.78);
      border: 1px solid rgba(255, 255, 255, 0.9);
      box-shadow: var(--shadow-soft);
      transition: opacity 220ms ease, transform 220ms ease, filter 220ms ease;
    }

    .panel-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 10px;
    }

    .panel-header strong {
      font-size: 1rem;
      letter-spacing: -0.02em;
    }

    .panel-header span {
      color: var(--teal-strong);
      font-size: 0.72rem;
      font-weight: 900;
      letter-spacing: 0.08em;
    }

    .menu-list,
    .detail-list {
      display: grid;
      gap: 0;
    }

    .menu-row,
    .detail-row {
      display: flex;
      align-items: center;
      gap: 12px;
      min-height: 56px;
      padding: 10px 0;
    }

    .menu-row + .menu-row,
    .detail-row + .detail-row {
      border-top: 1px solid rgba(188, 226, 219, 0.8);
    }

    .menu-icon,
    .detail-icon {
      width: 40px;
      height: 40px;
      border-radius: 15px;
      display: grid;
      place-items: center;
      flex: 0 0 auto;
      background:
        linear-gradient(180deg, var(--icon-bg-top), var(--icon-bg-bottom));
      border: 1px solid var(--icon-border);
      box-shadow: var(--icon-shadow);
      color: var(--icon-ink);
      font-size: 0.98rem;
      font-weight: 900;
    }

    .menu-copy,
    .detail-copy {
      min-width: 0;
      flex: 1;
    }

    .menu-copy strong,
    .detail-copy label {
      display: block;
      font-size: 0.92rem;
      font-weight: 900;
      letter-spacing: -0.02em;
    }

    .menu-copy span,
    .detail-copy span {
      display: block;
      margin-top: 4px;
      color: var(--muted);
      font-size: 0.78rem;
      line-height: 1.35;
    }

    .menu-chevron {
      color: var(--icon-ink-soft);
      font-size: 1.2rem;
      font-weight: 700;
    }

    .detail-value {
      max-width: 140px;
      text-align: right;
      color: var(--fg);
      font-size: 0.84rem;
      font-weight: 900;
      line-height: 1.28;
    }

    .logout {
      height: 50px;
      border-radius: 18px;
      border: 1px solid rgba(213, 120, 106, 0.22);
      background: rgba(255, 255, 255, 0.72);
      color: var(--danger);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-size: 0.92rem;
      font-weight: 900;
      box-shadow: 0 10px 24px rgba(211, 136, 121, 0.08);
      transition: opacity 220ms ease, transform 220ms ease, filter 220ms ease;
    }

    .sheet-backdrop {
      position: absolute;
      inset: 0;
      background: rgba(43, 75, 128, 0.16);
      backdrop-filter: blur(5px);
      -webkit-backdrop-filter: blur(5px);
      opacity: 0;
      pointer-events: none;
      transition: opacity 220ms ease;
      z-index: 5;
    }

    .detail-sheet {
      position: absolute;
      left: 12px;
      right: 12px;
      bottom: 12px;
      padding: 14px 16px 16px;
      border-radius: 30px 30px 22px 22px;
      background:
        radial-gradient(circle at 84% 10%, rgba(198, 204, 255, 0.52), transparent 18%),
        radial-gradient(circle at 12% 100%, rgba(170, 241, 239, 0.22), transparent 22%),
        linear-gradient(180deg, rgba(255, 255, 255, 0.96), rgba(247, 252, 255, 0.94)),
        linear-gradient(180deg, rgba(250, 252, 255, 0.94), rgba(244, 249, 255, 0.96));
      border: 1px solid rgba(255, 255, 255, 0.98);
      box-shadow:
        0 30px 70px rgba(26, 88, 105, 0.2),
        inset 0 1px 0 rgba(255, 255, 255, 0.95);
      transform: translateY(calc(100% + 24px));
      opacity: 0;
      pointer-events: none;
      transition:
        transform 320ms cubic-bezier(0.22, 1, 0.36, 1),
        opacity 220ms ease;
      z-index: 6;
    }

    .sheet-grabber {
      width: 54px;
      height: 5px;
      border-radius: 999px;
      background: rgba(93, 160, 176, 0.22);
      margin: 0 auto 14px;
    }

    .sheet-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 10px;
    }

    .sheet-kicker {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: var(--teal-strong);
      font-size: 0.72rem;
      font-weight: 900;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .sheet-kicker::before {
      content: "◌";
      color: var(--gold);
    }

    .sheet-title {
      margin-top: 6px;
      font-size: 1.28rem;
      line-height: 1.05;
      letter-spacing: -0.04em;
    }

    .sheet-close {
      min-width: 64px;
      height: 38px;
      padding: 0 12px;
      border: 1px solid rgba(203, 220, 247, 0.92);
      border-radius: 14px;
      background: rgba(242, 247, 255, 0.94);
      color: var(--teal-strong);
      font-size: 0.82rem;
      font-weight: 900;
      cursor: pointer;
    }

    .sheet-close:focus-visible,
    .hero-button:focus-visible .hero {
      outline: 2px solid rgba(34, 184, 183, 0.42);
      outline-offset: 3px;
    }

    .screen[data-sheet-open="true"] .sheet-backdrop {
      opacity: 1;
      pointer-events: auto;
    }

    .screen[data-sheet-open="true"] .detail-sheet {
      transform: translateY(0);
      opacity: 1;
      pointer-events: auto;
    }

    .screen[data-sheet-open="true"] .settings-panel,
    .screen[data-sheet-open="true"] .logout {
      opacity: 0.22;
      transform: translateY(10px);
      filter: blur(8px);
      pointer-events: none;
    }

    @media (max-height: 860px) {
      body {
        overflow: auto;
      }

      .phone {
        height: 844px;
      }
    }
  </style>
</head>
<body>
  <main class="phone" aria-label="계정정보 화면 시안">
    <section class="screen" data-sheet-open="false">
      <header class="topbar">
        <div class="icon-button" aria-hidden="true">‹</div>
        <div class="topbar-copy">
          
          
        </div>
        
      </header>

      <div class="hero-button" id="profile-trigger" role="button" tabindex="0" aria-controls="detail-sheet" aria-expanded="false">
        <section class="hero" aria-label="프로필 요약">
          <div class="hero-brand">
            
            
          </div>
          <div class="hero-main">
            <div class="avatar">
              <img src="assets/images/brand/magic_conch.png" alt="매직소라 조개 심볼">
              
            </div>
            <div class="hero-copy">
              <strong>계정 보관함</strong>
              <p>질문기록 연결됨</p>
              <div class="hero-account">
                <span class="hero-login-state">카카오 로그인됨</span>
                <span class="hero-email">magic.sora@kakao.com</span>
              </div>
            </div>
          </div>
          
        </section>
      </div>

      <section class="panel settings-panel" aria-label="설정과 기록">
        <div class="panel-header">
          <strong>기록과 설정</strong>
          
        </div>
        <div class="menu-list">
          <div class="menu-row">
            <div class="menu-icon">⟳</div>
            <div class="menu-copy">
              <strong>질문기록</strong>
              <span>남긴 질문 다시 보기</span>
            </div>
            <div class="menu-chevron">›</div>
          </div>
          <div class="menu-row">
            <div class="menu-icon">≋</div>
            <div class="menu-copy">
              <strong>평가 기준</strong>
              <span>가중치 조정</span>
            </div>
            <div class="menu-chevron">›</div>
          </div>
          <div class="menu-row">
            <div class="menu-icon">◔</div>
            <div class="menu-copy">
              <strong>알림 설정</strong>
              <span>도착 방식 관리</span>
            </div>
            <div class="menu-chevron">›</div>
          </div>
          <div class="menu-row">

  <script>
    (function () {
      var screen = document.querySelector('.screen');
      var trigger = document.getElementById('profile-trigger');
      var detailSheet = document.getElementById('detail-sheet');
      var backdrop = document.getElementById('sheet-backdrop');
      var closeButton = document.getElementById('sheet-close');
      var actionLabel = document.getElementById('profile-action');
      var hintLabel = document.getElementById('profile-hint');
      var chevron = document.getElementById('profile-chevron');

      function setSheet(open) {
        screen.dataset.sheetOpen = open ? 'true' : 'false';
        trigger.setAttribute('aria-expanded', String(open));
        detailSheet.setAttribute('aria-hidden', String(!open));
        backdrop.setAttribute('aria-hidden', String(!open));
        actionLabel.textContent = open ? '닫기' : '상세 보기';
        hintLabel.textContent = open ? '카드를 다시 누르면 닫힙니다.' : '카드 탭으로 상세 열기';
        chevron.textContent = open ? '⌃' : '⌄';
      }

      trigger.addEventListener('click', function () {
        setSheet(screen.dataset.sheetOpen !== 'true');
      });

      trigger.addEventListener('keydown', function (event) {
        if (event.key === 'Enter' || event.key === ' ') {
          event.preventDefault();
          setSheet(screen.dataset.sheetOpen !== 'true');
        }
      });

      closeButton.addEventListener('click', function () {
        setSheet(false);
      });

      backdrop.addEventListener('click', function () {
        setSheet(false);
      });

      document.addEventListener('keydown', function (event) {
        if (event.key === 'Escape' && screen.dataset.sheetOpen === 'true') {
          setSheet(false);
        }
      });
    })();
  </script>
