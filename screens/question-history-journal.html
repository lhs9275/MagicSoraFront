<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>질문 저널</title>
  <style>
    :root {
      --bg: oklch(98% 0.012 290);
      --surface: rgba(255, 251, 248, 0.82);
      --surface-strong: rgba(255, 255, 255, 0.94);
      --paper: rgba(255, 251, 245, 0.92);
      --fg: oklch(24% 0.03 288);
      --muted: oklch(52% 0.025 282);
      --accent: oklch(71% 0.08 302);
      --accent-strong: oklch(58% 0.11 300);
      --accent-soft: rgba(239, 227, 255, 0.9);
      --teal-soft: rgba(207, 244, 235, 0.86);
      --sand: rgba(255, 241, 209, 0.72);
      --line: rgba(160, 134, 198, 0.2);
      --shadow: 0 28px 56px rgba(131, 116, 176, 0.16);
      --font-display: "Iowan Old Style", "Apple SD Gothic Neo", "Noto Sans KR", serif;
      --font-body: "Pretendard Variable", "SUIT Variable", "Apple SD Gothic Neo", "Noto Sans KR", system-ui, sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      background:
        radial-gradient(circle at top left, rgba(203, 245, 233, 0.92), transparent 28%),
        radial-gradient(circle at 100% 90%, rgba(255, 240, 190, 0.72), transparent 18%),
        linear-gradient(180deg, #eef8ff 0%, #fdf7ff 52%, #fffaf3 100%);
      color: var(--fg);
      font-family: var(--font-body);
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background:
        linear-gradient(180deg, rgba(255, 255, 255, 0.32), transparent 28%),
        repeating-linear-gradient(
          90deg,
          rgba(255, 255, 255, 0.1) 0,
          rgba(255, 255, 255, 0.1) 1px,
          transparent 1px,
          transparent 22px
        );
      opacity: 0.46;
    }

    .page {
      position: relative;
      min-height: 100dvh;
      padding: 28px 18px 132px;
    }

    .app {
      position: relative;
      max-width: 430px;
      margin: 0 auto;
      display: grid;
      gap: 16px;
    }

    .hero {
      position: relative;
      overflow: hidden;
      padding: 22px;
      border-radius: 32px;
      background: linear-gradient(180deg, rgba(255, 251, 248, 0.82), rgba(255, 255, 255, 0.72));
      border: 1px solid rgba(162, 136, 198, 0.18);
      box-shadow: var(--shadow);
      backdrop-filter: blur(18px);
    }

    .hero::after {
      content: "";
      position: absolute;
      inset: auto -20% -28% 35%;
      height: 180px;
      background: radial-gradient(circle, rgba(177, 156, 223, 0.24), transparent 62%);
      pointer-events: none;
    }

    .hero-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
    }

    .mono {
      display: block;
      color: var(--muted);
      font-size: 0.76rem;
      font-weight: 800;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    h1 {
      margin: 8px 0 0;
      max-width: 9ch;
      font-family: var(--font-display);
      font-size: clamp(2.2rem, 6vw, 3rem);
      line-height: 0.96;
      letter-spacing: -0.05em;
      text-wrap: balance;
    }

    .hero p {
      margin: 10px 0 0;
      max-width: 28ch;
      color: var(--muted);
      line-height: 1.7;
      font-size: 0.95rem;
    }

    .hero img {
      width: 92px;
      opacity: 0.78;
      filter: drop-shadow(0 8px 20px rgba(128, 111, 180, 0.18));
    }

    .search-card,
    .journal,
    .focus-card,
    .empty {
      border-radius: 28px;
      background: var(--surface);
      border: 1px solid rgba(159, 136, 194, 0.16);
      box-shadow: var(--shadow);
      backdrop-filter: blur(18px);
    }

    .search-card {
      padding: 16px;
      display: grid;
      gap: 14px;
    }

    .search {
      display: flex;
      align-items: center;
      gap: 12px;
      min-height: 58px;
      padding: 0 16px;
      border-radius: 20px;
      background: rgba(255, 255, 255, 0.82);
      border: 1px solid rgba(161, 137, 197, 0.16);
    }

    .search svg {
      width: 18px;
      height: 18px;
      color: var(--muted);
      flex: 0 0 auto;
    }

    .search input {
      flex: 1 1 auto;
      border: 0;
      background: transparent;
      color: var(--fg);
      font-size: 1rem;
      outline: none;
    }

    .search input::placeholder {
      color: rgba(110, 90, 143, 0.62);
    }

    .clear-button,
    .chip,
    .note,
    .footer-action,
    .entry {
      font: inherit;
    }

    .clear-button {
      width: 34px;
      height: 34px;
      border: 0;
      border-radius: 12px;
      background: rgba(248, 239, 255, 0.96);
      color: var(--muted);
      cursor: pointer;
    }

    .chip-row {
      display: flex;
      gap: 10px;
      overflow-x: auto;
      padding-bottom: 2px;
      scrollbar-width: none;
    }

    .chip-row::-webkit-scrollbar {
      display: none;
    }

    .chip {
      flex: 0 0 auto;
      min-height: 38px;
      padding: 0 14px;
      border: 1px solid rgba(165, 140, 196, 0.18);
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.76);
      color: var(--muted);
      cursor: pointer;
      transition: transform 180ms ease, border-color 180ms ease, background-color 180ms ease;
    }

    .chip.is-active,
    .chip:hover,
    .chip:focus-visible {
      transform: translateY(-1px);
      background: rgba(246, 237, 255, 0.96);
      border-color: rgba(149, 116, 198, 0.26);
      color: var(--accent-strong);
      outline: none;
    }

    .note-strip {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }

    .note {
      padding: 12px 14px;
      border-radius: 18px;
      background: rgba(255, 255, 255, 0.76);
      border: 1px solid rgba(164, 142, 196, 0.12);
    }

    .note strong {
      display: block;
      font-size: 0.92rem;
      letter-spacing: -0.02em;
    }

    .note span {
      display: block;
      margin-top: 5px;
      color: var(--muted);
      font-size: 0.78rem;
      line-height: 1.45;
    }

    .journal {
      padding: 18px;
      display: grid;
      gap: 16px;
    }

    .journal-head {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      gap: 12px;
    }

    .journal-head h2 {
      margin: 6px 0 0;
      font-size: 1.34rem;
      letter-spacing: -0.03em;
    }

    .journal-head p {
      margin: 0;
      color: var(--muted);
      font-size: 0.9rem;
    }

    .groups {
      display: grid;
      gap: 16px;
    }

    .group {
      display: grid;
      gap: 10px;
    }

    .group-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 0 4px;
    }

    .group-head strong {
      font-size: 1rem;
      letter-spacing: -0.02em;
    }

    .group-head span {
      color: var(--muted);
      font-size: 0.82rem;
      font-weight: 700;
    }

    .entry {
      position: relative;
      display: grid;
      gap: 8px;
      width: 100%;
      padding: 16px 18px 16px 22px;
      border: 0;
      border-radius: 24px;
      background: var(--paper);
      border: 1px solid rgba(160, 138, 194, 0.14);
      text-align: left;
      cursor: pointer;
      transition: transform 180ms ease, box-shadow 180ms ease, border-color 180ms ease;
    }

    .entry::before {
      content: "";
      position: absolute;
      left: 10px;
      top: 19px;
      width: 4px;
      height: calc(100% - 38px);
      border-radius: 999px;
      background: linear-gradient(180deg, rgba(161, 137, 198, 0.7), rgba(107, 205, 202, 0.65));
      opacity: 0.85;
    }

    .entry:hover,
    .entry:focus-visible,
    .entry.is-active {
      transform: translateY(-1px);
      box-shadow: 0 16px 26px rgba(133, 117, 179, 0.12);
      border-color: rgba(149, 120, 193, 0.24);
      outline: none;
    }

    .entry-top {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      min-height: 26px;
      padding: 0 10px;
      border-radius: 999px;
      background: rgba(245, 236, 255, 0.9);
      color: var(--accent-strong);
      font-size: 0.78rem;
      font-weight: 800;
      letter-spacing: 0.03em;
    }

    .entry-top span:last-child {
      color: var(--muted);
      font-size: 0.78rem;
      font-weight: 700;
    }

    .entry strong {
      display: block;
      font-size: 1rem;
      line-height: 1.55;
      letter-spacing: -0.02em;
      text-wrap: pretty;
    }

    .entry p {
      margin: 0;
      color: var(--muted);
      line-height: 1.55;
      font-size: 0.9rem;
    }

    .focus-card {
      padding: 18px;
      display: grid;
      gap: 10px;
      background: linear-gradient(180deg, rgba(252, 246, 255, 0.92), rgba(255, 255, 255, 0.88));
    }

    .focus-card strong {
      display: block;
      font-size: 1.08rem;
      line-height: 1.5;
      letter-spacing: -0.03em;
    }

    .focus-card p {
      margin: 0;
      color: var(--muted);
      line-height: 1.65;
      font-size: 0.92rem;
    }

    .focus-card .actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .focus-card .actions button {
      min-height: 42px;
      padding: 0 14px;
      border-radius: 16px;
      border: 1px solid rgba(160, 138, 194, 0.14);
      background: rgba(255, 255, 255, 0.86);
      color: var(--fg);
      font-weight: 700;
      cursor: pointer;
    }

    .focus-card .actions .primary {
      background: linear-gradient(135deg, rgba(245, 225, 255, 0.96), rgba(214, 238, 235, 0.96));
    }

    .empty {
      padding: 22px;
      display: none;
      text-align: center;
    }

    .empty strong {
      display: block;
      margin-top: 8px;
      font-size: 1.14rem;
      letter-spacing: -0.03em;
    }

    .empty p {
      margin: 8px 0 0;
      color: var(--muted);
      line-height: 1.65;
      font-size: 0.92rem;
    }

    .footer-action {
      position: fixed;
      left: 50%;
      bottom: 22px;
      transform: translateX(-50%);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      min-height: 54px;
      min-width: min(390px, calc(100vw - 32px));
      padding: 0 18px;
      border-radius: 999px;
      border: 1px solid rgba(157, 134, 193, 0.18);
      background: rgba(255, 255, 255, 0.82);
      backdrop-filter: blur(16px);
      color: var(--fg);
      font-weight: 800;
      text-decoration: none;
      box-shadow: 0 18px 34px rgba(130, 115, 175, 0.14);
    }

    .footer-action span:last-child {
      color: var(--muted);
      font-weight: 700;
    }
  </style>
</head>
<body>
  <div class="page">
    <main class="app">
      <section class="hero">
        <div class="hero-top">
          <div>
            <span class="mono">QUESTION JOURNAL</span>
            <h1>대화의 흔적을 부드럽게 다시 읽기</h1>
            <p>질문을 보관함보다는 저널처럼 다루는 방향입니다. 브랜드 감성은 더 남지만, 정보 밀도는 낮아집니다.</p>
          </div>
          <img src="../assets/images/brand/magic_conch.png" alt="" />
        </div>
      </section>

      <section class="search-card">
        <label class="search">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M11 18a7 7 0 1 1 0-14 7 7 0 0 1 0 14Zm9 3-5.2-5.2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
          </svg>
          <input id="search-input" type="search" placeholder="기억나는 단어나 초성으로 찾기" autocomplete="off" />
          <button class="clear-button" id="clear-button" type="button" aria-label="검색어 지우기">×</button>
        </label>
        <div class="chip-row" id="chip-row" role="tablist" aria-label="질문 카테고리"></div>
        <div class="note-strip" id="note-strip"></div>
      </section>

      <section class="journal">
        <div class="journal-head">
          <div>
            <span class="mono">COLLECTED THREADS</span>
            <h2>질문 저널</h2>
          </div>
          <p id="result-count">25개</p>
        </div>
        <div class="groups" id="groups"></div>
      </section>

      <section class="focus-card">
        <span class="mono">SELECTED THREAD</span>
        <strong id="focus-title">오늘 질문 기록을 한눈에 정리해줘.</strong>
        <p id="focus-copy">선택한 질문을 다시 입력하기보다, 이어서 다시 생각하게 만드는 흐름에 더 어울립니다.</p>
        <div class="actions">
          <button class="primary" type="button">이 질문 이어서 보기</button>
          <button type="button">질문 복사</button>
        </div>
      </section>

      <section class="empty" id="empty-state">
        <span class="mono">NO MATCH</span>
        <strong>일치하는 질문이 없습니다.</strong>
        <p>필터를 전체로 바꾸거나 다른 단어로 다시 찾아보세요.</p>
      </section>
    </main>

    <a class="footer-action" href="../index.html">
      <span>채팅으로 돌아가기</span>
      <span>시안 선택 화면</span>
    </a>
  </div>

  <script>
    const QUESTIONS = [
      "나는 사람이다",
      "오늘 토론 주제는 무엇이 좋을까?",
      "AI 의견을 어떻게 비교하면 좋을까?",
      "반박 근거를 더 탄탄하게 만들려면?",
      "최종 결론을 한 문장으로 정리해줘.",
      "환경 보호 토론에서 핵심 근거는 뭐야?",
      "찬성 입장에서 설득력 있는 예시를 알려줘.",
      "반대 입장에서 가장 강한 논리는 뭐야?",
      "토론 시작 발언을 자연스럽게 만들어줘.",
      "상대방 질문에 짧게 답하는 방법은?",
      "논리적으로 보이게 말 순서를 정리해줘.",
      "근거가 부족한 문장을 고쳐줘.",
      "청중이 이해하기 쉬운 비유를 추천해줘.",
      "마지막 마무리 멘트를 만들어줘.",
      "내 주장에 어울리는 키워드를 뽑아줘.",
      "학교 급식 개선 토론 주제를 정리해줘.",
      "스마트폰 사용 제한 찬반 근거를 알려줘.",
      "동물 실험 반대 입장 근거를 만들어줘.",
      "발표할 때 긴장하지 않는 방법은?",
      "토론에서 질문을 날카롭게 만드는 법은?",
      "내 의견을 더 짧고 강하게 고쳐줘.",
      "자료 조사할 때 어떤 순서로 찾아야 해?",
      "상대방 주장에 예의 있게 반박하는 문장을 써줘.",
      "토론 카드에 넣을 핵심 문장을 추천해줘.",
      "오늘 질문 기록을 한눈에 정리해줘."
    ];

    const CATEGORY_RULES = [
      { label: "토론 준비", test: (q) => /토론|찬성|반대|주제/.test(q), note: "주제와 입장 설계에 가까운 질문" },
      { label: "논리 강화", test: (q) => /근거|반박|논리|주장/.test(q), note: "근거를 세우고 반박을 다듬는 질문" },
      { label: "표현 다듬기", test: (q) => /문장|정리|키워드|마무리|발언|비유/.test(q), note: "전달 방식을 손보는 질문" },
      { label: "실전 발표", test: (q) => /발표|설득|청중|긴장/.test(q), note: "말하는 순간을 대비하는 질문" },
      { label: "리서치", test: (q) => /자료|조사|예시/.test(q), note: "자료와 예시를 찾는 질문" }
    ];

    const initials = [
      "ㄱ", "ㄲ", "ㄴ", "ㄷ", "ㄸ", "ㄹ", "ㅁ", "ㅂ", "ㅃ", "ㅅ",
      "ㅆ", "ㅇ", "ㅈ", "ㅉ", "ㅊ", "ㅋ", "ㅌ", "ㅍ", "ㅎ"
    ];

    const items = QUESTIONS.map((question, index) => {
      const match = CATEGORY_RULES.find((rule) => rule.test(question));
      return {
        id: index + 1,
        question,
        category: match?.label || "일반 질문",
        note: match?.note || "짧게 다시 꺼내볼 수 있는 일반 질문"
      };
    });

    const searchInput = document.getElementById("search-input");
    const clearButton = document.getElementById("clear-button");
    const chipRow = document.getElementById("chip-row");
    const noteStrip = document.getElementById("note-strip");
    const groups = document.getElementById("groups");
    const resultCount = document.getElementById("result-count");
    const focusTitle = document.getElementById("focus-title");
    const focusCopy = document.getElementById("focus-copy");
    const emptyState = document.getElementById("empty-state");

    let activeCategory = "전체";
    let selectedId = items[items.length - 1].id;

    function compactSearchText(value) {
      return value.replace(/\s+/g, "");
    }

    function toHangulInitials(value) {
      return Array.from(value).map((char) => {
        const code = char.charCodeAt(0);
        if (code >= 0xac00 && code <= 0xd7a3) {
          return initials[Math.floor((code - 0xac00) / 588)];
        }
        return char;
      }).join("");
    }

    function toHangulWordInitials(value) {
      return value
        .split(/\s+/)
        .filter(Boolean)
        .map((word) => toHangulInitials(word[0]))
        .join("");
    }

    function matchesKeyword(question, keyword) {
      if (!keyword) {
        return true;
      }
      const rawQuestion = question.toLowerCase();
      const compactQuestion = compactSearchText(rawQuestion);
      const compactKeyword = compactSearchText(keyword.toLowerCase());
      const questionInitials = toHangulInitials(compactQuestion);
      const keywordInitials = toHangulInitials(compactKeyword);
      const wordInitials = toHangulWordInitials(rawQuestion);
      return compactQuestion.includes(compactKeyword)
        || questionInitials.includes(compactKeyword)
        || questionInitials.includes(keywordInitials)
        || wordInitials.includes(compactKeyword)
        || wordInitials.includes(keywordInitials);
    }

    function visibleItems() {
      const keyword = searchInput.value.trim();
      return items.filter((item) => {
        const categoryMatch = activeCategory === "전체" || item.category === activeCategory;
        return categoryMatch && matchesKeyword(item.question, keyword);
      });
    }

    function renderChips() {
      const counts = items.reduce((map, item) => {
        map[item.category] = (map[item.category] || 0) + 1;
        return map;
      }, {});
      const labels = ["전체", ...Object.keys(counts)];

      chipRow.innerHTML = labels.map((label) => {
        const count = label === "전체" ? items.length : counts[label];
        return `
          <button class="chip${label === activeCategory ? " is-active" : ""}" type="button" data-category="${label}">
            ${label} · ${count}
          </button>
        `;
      }).join("");

      chipRow.querySelectorAll(".chip").forEach((chip) => {
        chip.addEventListener("click", () => {
          activeCategory = chip.dataset.category;
          render();
        });
      });
    }

    function renderNotes() {
      const counts = items.reduce((map, item) => {
        map[item.category] = (map[item.category] || 0) + 1;
        return map;
      }, {});

      const highlighted = Object.entries(counts)
        .sort((a, b) => b[1] - a[1])
        .slice(0, 2);

      noteStrip.innerHTML = highlighted.map(([label, count]) => {
        const rule = CATEGORY_RULES.find((entry) => entry.label === label);
        return `
          <div class="note">
            <strong>${label}</strong>
            <span>${count}개의 질문 · ${rule ? rule.note : "자주 꺼내보는 질문 흐름"}</span>
          </div>
        `;
      }).join("");
    }

    function groupItems(listItems) {
      return listItems.reduce((map, item) => {
        if (!map[item.category]) {
          map[item.category] = [];
        }
        map[item.category].push(item);
        return map;
      }, {});
    }

    function updateFocus(item) {
      if (!item) {
        return;
      }
      focusTitle.textContent = item.question;
      focusCopy.textContent = `${item.category} 질문으로 다시 이어가기 좋은 흐름입니다. 버튼의 무게를 낮춰서 기록을 읽는 리듬을 깨지 않게 잡았습니다.`;
    }

    function renderGroups() {
      const listItems = visibleItems();
      resultCount.textContent = `${listItems.length}개`;

      if (!listItems.length) {
        groups.innerHTML = "";
        emptyState.style.display = "block";
        return;
      }

      emptyState.style.display = "none";

      if (!listItems.find((item) => item.id === selectedId)) {
        selectedId = listItems[0].id;
      }

      const grouped = groupItems(listItems);
      const sections = Object.entries(grouped)
        .sort((a, b) => b[1].length - a[1].length);

      groups.innerHTML = sections.map(([label, group]) => `
        <section class="group">
          <div class="group-head">
            <strong>${label}</strong>
            <span>${group.length}개</span>
          </div>
          ${group.map((item, index) => `
            <button class="entry${item.id === selectedId ? " is-active" : ""}" type="button" data-id="${item.id}">
              <span class="entry-top">
                <span class="pill">${label}</span>
                <span>질문 ${String(index + 1).padStart(2, "0")}</span>
              </span>
              <strong>${item.question}</strong>
              <p>${item.note}</p>
            </button>
          `).join("")}
        </section>
      `).join("");

      groups.querySelectorAll(".entry").forEach((entry) => {
        entry.addEventListener("click", () => {
          selectedId = Number(entry.dataset.id);
          updateFocus(items.find((item) => item.id === selectedId));
          renderGroups();
        });
      });

      updateFocus(items.find((item) => item.id === selectedId));
    }

    function render() {
      renderChips();
      renderGroups();
    }

    searchInput.addEventListener("input", renderGroups);
    clearButton.addEventListener("click", () => {
      searchInput.value = "";
      searchInput.focus();
      renderGroups();
    });

    renderNotes();
    render();
  </script>
</body>
</html>
