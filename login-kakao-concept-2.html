<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Magic Sora Kakao Login Concept</title>
  <meta
    name="description"
    content="브랜드 스타일을 강화한 Magic Sora 카카오 로그인 화면 시안"
  />
  <style>
    :root {
      --sky-top: oklch(84% 0.09 196);
      --sky-mid: oklch(78% 0.13 220);
      --ocean-mid: oklch(66% 0.14 224);
      --sand: oklch(95% 0.07 93);
      --sand-deep: oklch(88% 0.1 92);
      --reef-pink: oklch(79% 0.19 339);
      --reef-purple: oklch(73% 0.17 300);
      --seafoam: oklch(91% 0.08 182);
      --sun-gold: oklch(89% 0.16 93);
      --wordmark-stroke: oklch(82% 0.17 78);
      --text-main: oklch(30% 0.07 223);
      --text-soft: oklch(42% 0.05 218);
      --white: oklch(99% 0.01 95);
      --card-shadow: 0 28px 80px rgba(15, 74, 128, 0.18);
      --soft-shadow: 0 18px 36px rgba(87, 158, 195, 0.18);
      --font-brand: "Arial Rounded MT Bold", "Trebuchet MS", "Apple SD Gothic Neo",
        "Noto Sans KR", sans-serif;
      --font-body: "Pretendard Variable", "SUIT Variable", "Apple SD Gothic Neo",
        "Noto Sans KR", system-ui, sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      color: var(--text-main);
      font-family: var(--font-body);
      background:
        radial-gradient(circle at 16% 8%, rgba(255, 235, 118, 0.84), transparent 14%),
        radial-gradient(circle at 18% 22%, rgba(255, 255, 255, 0.3), transparent 7%),
        radial-gradient(circle at 78% 16%, rgba(250, 181, 229, 0.34), transparent 18%),
        linear-gradient(180deg, #84e8eb 0%, #70cce7 42%, #4aa7ea 68%, #8fd7ed 100%);
    }

    body {
      height: 100dvh;
      overflow: hidden;
      position: relative;
      isolation: isolate;
    }

    body::before,
    body::after {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: -3;
    }

    body::before {
      background:
        radial-gradient(circle at 14% 60%, rgba(64, 160, 228, 0.24), transparent 18%),
        radial-gradient(circle at 86% 72%, rgba(29, 127, 216, 0.2), transparent 18%),
        radial-gradient(circle at 60% 12%, rgba(255, 255, 255, 0.24), transparent 12%);
      filter: blur(14px);
      animation: drift-cloud 14s ease-in-out infinite alternate;
    }

    body::after {
      inset: auto 0 0;
      height: 31vh;
      background:
        radial-gradient(100% 120% at 50% 100%, rgba(255, 255, 255, 0.58), transparent 52%),
        linear-gradient(180deg, rgba(255, 247, 194, 0) 0%, rgba(255, 241, 176, 0.95) 76%);
      z-index: -2;
    }

    .scene {
      height: 100dvh;
      display: grid;
      place-items: center;
      padding:
        max(14px, env(safe-area-inset-top))
        14px
        max(14px, env(safe-area-inset-bottom))
        14px;
      position: relative;
      overflow: hidden;
    }

    .scene::before,
    .scene::after {
      content: "";
      position: absolute;
      border-radius: 999px;
      pointer-events: none;
      z-index: -1;
    }

    .scene::before {
      width: 240px;
      height: 240px;
      left: -70px;
      bottom: 54px;
      background:
        radial-gradient(circle at 40% 35%, rgba(0, 162, 133, 0.82), transparent 26%),
        radial-gradient(circle at 70% 70%, rgba(3, 142, 122, 0.94), transparent 36%);
      filter: blur(6px);
      opacity: 0.55;
      transform: rotate(-14deg);
    }

    .scene::after {
      width: 220px;
      height: 220px;
      right: -74px;
      bottom: 30px;
      background:
        radial-gradient(circle at 30% 38%, rgba(255, 102, 193, 0.86), transparent 26%),
        radial-gradient(circle at 74% 74%, rgba(193, 70, 214, 0.94), transparent 32%);
      filter: blur(8px);
      opacity: 0.62;
      transform: rotate(12deg);
    }

    .bubble,
    .spark {
      position: absolute;
      pointer-events: none;
    }

    .bubble {
      border-radius: 999px;
      background: radial-gradient(circle at 35% 32%, rgba(255, 255, 255, 0.96), rgba(255, 255, 255, 0.24) 38%, rgba(255, 255, 255, 0.08) 65%, transparent 70%);
      box-shadow: inset 0 -6px 10px rgba(82, 180, 231, 0.2);
      opacity: 0.72;
      animation: bubble-up 8s ease-in-out infinite;
    }

    .bubble-a {
      width: 18px;
      height: 18px;
      top: 118px;
      left: calc(50% - 188px);
      animation-delay: -1s;
    }

    .bubble-b {
      width: 24px;
      height: 24px;
      top: 162px;
      right: calc(50% - 184px);
      animation-delay: -3s;
    }

    .bubble-c {
      width: 12px;
      height: 12px;
      bottom: 172px;
      right: calc(50% - 214px);
      animation-delay: -4.5s;
    }

    .spark {
      width: 28px;
      height: 28px;
      background: linear-gradient(180deg, #ffe26a, #ffcf2d);
      clip-path: polygon(50% 0%, 62% 34%, 100% 50%, 62% 66%, 50% 100%, 38% 66%, 0% 50%, 38% 34%);
      filter: drop-shadow(0 6px 10px rgba(255, 192, 20, 0.3));
      opacity: 0.9;
      animation: twinkle 4.6s ease-in-out infinite;
    }

    .spark-a {
      top: 106px;
      right: calc(50% - 134px);
    }

    .spark-b {
      bottom: 168px;
      left: calc(50% - 160px);
      width: 22px;
      height: 22px;
      animation-delay: -2.3s;
    }

    .shell-login {
      width: min(100%, 430px);
      height: 100%;
      max-height: 920px;
      padding: 18px 18px 22px;
      border-radius: 36px;
      border: 1px solid rgba(255, 255, 255, 0.72);
      background:
        linear-gradient(180deg, rgba(255, 255, 255, 0.86), rgba(249, 252, 255, 0.78)),
        linear-gradient(180deg, rgba(247, 254, 255, 0.96), rgba(255, 247, 232, 0.94));
      box-shadow: var(--card-shadow);
      display: grid;
      grid-template-rows: auto 1fr auto;
      gap: 12px;
      position: relative;
      overflow: hidden;
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
    }

    .shell-login::before,
    .shell-login::after {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
    }

    .shell-login::before {
      background:
        radial-gradient(circle at 20% 0%, rgba(255, 255, 255, 0.74), transparent 20%),
        radial-gradient(circle at 78% 18%, rgba(243, 190, 248, 0.38), transparent 18%),
        radial-gradient(circle at 54% 86%, rgba(124, 233, 236, 0.28), transparent 24%);
      mix-blend-mode: screen;
    }

    .shell-login::after {
      inset: auto 0 0;
      height: 132px;
      background:
        radial-gradient(100% 120% at 50% 0%, rgba(255, 255, 255, 0.7), transparent 50%),
        linear-gradient(180deg, rgba(255, 244, 202, 0.1), rgba(255, 241, 190, 0.54));
      opacity: 0.95;
    }

    .hero {
      position: relative;
      display: grid;
      gap: 14px;
      padding: 6px 8px 0;
      z-index: 1;
      justify-items: center;
    }

    .hero-graphic {
      position: relative;
      width: 100%;
      min-height: clamp(230px, 36vh, 300px);
      display: grid;
      place-items: center;
      align-self: center;
    }

    .hero-halo {
      position: absolute;
      inset: 16px 28px 18px;
      border-radius: 50%;
      background:
        radial-gradient(circle at 50% 42%, rgba(255, 255, 255, 0.92), rgba(255, 255, 255, 0.26) 42%, transparent 68%),
        radial-gradient(circle at 50% 74%, rgba(120, 230, 238, 0.4), transparent 54%);
      filter: blur(1px);
    }

    .hero-ring {
      position: absolute;
      width: clamp(176px, 46vw, 214px);
      height: clamp(176px, 46vw, 214px);
      border-radius: 50%;
      border: 3px solid rgba(255, 255, 255, 0.78);
      box-shadow:
        inset 0 0 0 1px rgba(255, 203, 89, 0.36),
        0 16px 24px rgba(101, 177, 220, 0.16);
      opacity: 0.82;
      transform: rotate(-18deg);
    }

    .hero-orbit {
      position: absolute;
      width: clamp(208px, 56vw, 254px);
      height: clamp(102px, 26vw, 126px);
      border-radius: 999px;
      border: 2px solid rgba(255, 255, 255, 0.82);
      opacity: 0.74;
      transform: rotate(-18deg) translateY(-6px);
    }

    .hero-orbit::after {
      content: "";
      position: absolute;
      width: 14px;
      height: 14px;
      top: 10px;
      right: 20px;
      border-radius: 999px;
      background: linear-gradient(180deg, #ffe167, #ffbf38);
      box-shadow: 0 0 0 4px rgba(255, 255, 255, 0.6);
    }

    .shell-mark {
      position: relative;
      width: clamp(164px, 44vw, 212px);
      aspect-ratio: 1.3 / 1;
      object-fit: contain;
      filter: drop-shadow(0 16px 28px rgba(118, 171, 223, 0.24));
      animation: bob 6.8s ease-in-out infinite;
      z-index: 1;
    }

    .brand-stage {
      display: grid;
      gap: 8px;
      text-align: center;
      place-items: center;
    }

    .brand-wordmark {
      margin: 0 auto;
      font-family: var(--font-brand);
      font-size: clamp(3rem, 11vw, 4.6rem);
      line-height: 0.92;
      letter-spacing: -0.06em;
      color: #fffdf8;
      -webkit-text-stroke: 4px var(--wordmark-stroke);
      text-shadow:
        0 10px 20px rgba(255, 180, 71, 0.16),
        0 2px 0 rgba(255, 255, 255, 0.56);
      text-wrap: balance;
    }

    .brand-caption {
      margin: 0;
      max-width: 18ch;
      color: rgba(53, 104, 155, 0.88);
      font-size: 0.82rem;
      font-weight: 700;
      line-height: 1.35;
      letter-spacing: -0.01em;
      text-wrap: balance;
    }

    .hero-base {
      position: absolute;
      left: 50%;
      bottom: clamp(22px, 5vh, 42px);
      width: clamp(156px, 44vw, 204px);
      height: 38px;
      transform: translateX(-50%);
      border-radius: 999px;
      background:
        radial-gradient(circle at 50% 50%, rgba(255, 255, 255, 0.86), rgba(255, 255, 255, 0.12) 58%, transparent 76%),
        linear-gradient(180deg, rgba(140, 231, 238, 0.38), rgba(255, 236, 176, 0.26));
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.72),
        0 10px 22px rgba(108, 184, 224, 0.16);
      opacity: 0.92;
      z-index: 0;
    }

    .login-sheet {
      position: relative;
      z-index: 1;
      display: grid;
      gap: 12px;
      padding: 18px;
      border-radius: 26px;
      background:
        linear-gradient(180deg, rgba(255, 255, 255, 0.94), rgba(255, 250, 241, 0.88)),
        rgba(255, 255, 255, 0.72);
      border: 1px solid rgba(255, 255, 255, 0.92);
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.9),
        0 16px 36px rgba(98, 167, 213, 0.14);
      align-self: end;
    }

    .login-sheet::before {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: inherit;
      background:
        radial-gradient(circle at 16% 0%, rgba(118, 232, 236, 0.18), transparent 20%),
        radial-gradient(circle at 82% 100%, rgba(255, 199, 234, 0.18), transparent 26%);
      pointer-events: none;
    }

    .entry-note {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 0 4px;
      color: var(--text-soft);
      font-size: 0.82rem;
      font-weight: 700;
      letter-spacing: -0.01em;
    }

    .entry-dot {
      width: 8px;
      height: 8px;
      flex: 0 0 auto;
      border-radius: 999px;
      background: linear-gradient(180deg, #ffe26a, #ffbe3b);
      box-shadow: 0 0 0 5px rgba(255, 227, 115, 0.22);
    }

    .kakao-stage,
    .status,
    .sheet-footnote {
      position: relative;
      z-index: 1;
    }

    .kakao-stage {
      padding: 14px;
      border-radius: 22px;
      background:
        linear-gradient(180deg, rgba(255, 255, 255, 0.92), rgba(255, 254, 250, 0.84)),
        rgba(255, 255, 255, 0.74);
      border: 1px solid rgba(255, 214, 125, 0.42);
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.94),
        0 12px 22px rgba(255, 199, 58, 0.12);
    }

    .kakao-stage::before {
      content: "";
      position: absolute;
      inset: 10px;
      border-radius: 18px;
      background:
        radial-gradient(circle at 50% 0%, rgba(255, 225, 96, 0.2), transparent 36%),
        radial-gradient(circle at 12% 20%, rgba(118, 232, 236, 0.12), transparent 22%);
      pointer-events: none;
    }

    .kakao-button {
      width: 100%;
      padding: 0;
      border: 0;
      background: transparent;
      cursor: pointer;
      display: block;
      transition: transform 180ms ease, filter 180ms ease;
      position: relative;
      z-index: 1;
    }

    .kakao-button:hover,
    .kakao-button:focus-visible {
      transform: translateY(-2px);
      filter: drop-shadow(0 14px 24px rgba(255, 212, 59, 0.28));
      outline: none;
    }

    .kakao-button:active {
      transform: translateY(0) scale(0.985);
    }

    .kakao-button img {
      display: block;
      width: 100%;
      height: auto;
      border-radius: 12px;
    }

    .sheet-footnote {
      margin: 0;
      color: var(--text-soft);
      font-size: 0.74rem;
      font-weight: 600;
      line-height: 1.35;
      letter-spacing: -0.01em;
      text-align: center;
    }

    .status {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    .status[data-state="loading"] {
      color: oklch(62% 0.18 89);
    }

    .status[data-state="ready"] {
      color: oklch(55% 0.13 190);
    }

    @keyframes bob {
      0% {
        transform: translateY(0) rotate(-2deg);
      }
      50% {
        transform: translateY(-9px) rotate(2deg);
      }
      100% {
        transform: translateY(0) rotate(-2deg);
      }
    }

    @keyframes bubble-up {
      0% {
        transform: translateY(0) scale(1);
      }
      50% {
        transform: translateY(-14px) scale(1.06);
      }
      100% {
        transform: translateY(0) scale(1);
      }
    }

    @keyframes twinkle {
      0%,
      100% {
        transform: scale(1) rotate(0deg);
        opacity: 0.88;
      }
      50% {
        transform: scale(1.08) rotate(8deg);
        opacity: 1;
      }
    }

    @keyframes drift-cloud {
      0% {
        transform: translateY(0) scale(1);
      }
      100% {
        transform: translateY(10px) scale(1.04);
      }
    }

    @media (max-width: 520px) {
      .scene {
        padding: 0;
      }

      .shell-login {
        width: 100%;
        height: 100dvh;
        border-radius: 0;
        border-left: 0;
        border-right: 0;
        padding:
          max(18px, env(safe-area-inset-top))
          16px
          max(20px, calc(env(safe-area-inset-bottom) + 10px))
          16px;
      }

      .hero {
        padding: 4px 6px 0;
      }

      .hero-graphic {
        min-height: clamp(230px, 38vh, 320px);
      }

      .brand-wordmark {
        -webkit-text-stroke: 3px var(--wordmark-stroke);
      }
    }

    @media (max-height: 760px) {
      .scene::before,
      .scene::after {
        opacity: 0.4;
      }

      .hero-graphic {
        min-height: 210px;
      }

      .shell-mark {
        width: 152px;
      }

      .brand-caption,
      .sheet-footnote {
        display: none;
      }
    }
  </style>
</head>
<body>
  <main class="scene">
    <span class="bubble bubble-a" aria-hidden="true"></span>
    <span class="bubble bubble-b" aria-hidden="true"></span>
    <span class="bubble bubble-c" aria-hidden="true"></span>
    <span class="spark spark-a" aria-hidden="true"></span>
    <span class="spark spark-b" aria-hidden="true"></span>

    <section class="shell-login" aria-label="Magic Sora 카카오 로그인 화면">
      <header class="hero">
        <div class="brand-stage">
          <div class="brand-wordmark">magic sora</div>
          <p class="brand-caption">묻고 남기고 다시 꺼내보는 작은 시작</p>
        </div>
      </header>

      <div class="hero-graphic">
          <div class="hero-halo"></div>
          <div class="hero-ring"></div>
          <div class="hero-orbit"></div>
          <div class="hero-base" aria-hidden="true"></div>
          <img
            class="shell-mark"
            src="assets/images/brand/magic_conch.png"
            alt="매직 소라 조개 심볼"
          />
      </div>

      <section class="login-sheet" aria-label="카카오 로그인 영역">
        <div class="entry-note" aria-hidden="true">
          <span class="entry-dot"></span>
          <span>카카오로 바로 시작</span>
        </div>
        <div class="kakao-stage">
          <button class="kakao-button" id="kakaoButton" type="button" aria-label="카카오로 시작하기" aria-describedby="loginStatus">
            <img src="assets/images/auth/kakao_login_medium_wide.png" alt="카카오 로그인 버튼" />
          </button>
        </div>
        <p class="sheet-footnote">추가 가입 없이 바로 이어집니다</p>

        <div class="status" id="loginStatus" aria-live="polite" data-state="idle">
          버튼을 누르면 카카오 인증 플로우로 이어지는 자리입니다.
        </div>
      </section>
    </section>
  </main>

  <script>
    (function () {
      var button = document.getElementById("kakaoButton");
      var status = document.getElementById("loginStatus");
      var timeoutId = 0;

      if (!button || !status) return;

      button.addEventListener("click", function () {
        window.clearTimeout(timeoutId);
        status.dataset.state = "loading";
        status.textContent = "카카오 인증 화면으로 연결하는 중입니다.";

        timeoutId = window.setTimeout(function () {
          status.dataset.state = "ready";
          status.textContent = "실서비스에서는 이 자리에서 카카오 인증 창이 열립니다.";
        }, 1100);
      });
    })();
  </script>
</body>
</html>
